<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="מעקב יומי אחרי משקל, הרכב גוף ותזונה, עם דוחות שמראים איפה עומדים">
  <meta name="theme-color" content="#0D6E67">
  <title>מדדים</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css?v=v39">
</head>
<body>
  <nav class="tabs" id="tabs" role="tablist" aria-label="ניווט ראשי"></nav>

  <main class="app">
    <header class="masthead">
      <h1>מדדים</h1>
      <span class="stamp" id="stamp"></span>
    </header>

    <div id="controls"></div>

    <div class="view" id="view-today" role="tabpanel" aria-label="הזנה יומית"></div>
    <div class="view" id="view-entry" role="tabpanel" aria-label="רישום"></div>
    <div class="view" id="view-progress" role="tabpanel" aria-label="התקדמות"></div>
    <div class="view" id="view-target" role="tabpanel" aria-label="יעד"></div>
    <div class="view" id="view-calc" role="tabpanel" aria-label="חישוב"></div>
    <div class="view" id="view-status" role="tabpanel" aria-label="מצב"></div>
    <div class="view" id="view-trends" role="tabpanel" aria-label="מגמות"></div>
    <div class="view" id="view-data" role="tabpanel" aria-label="נתונים"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- שכבת הלוגיקה: טהורה, נבדקת ב-node -->
  <script src="js/lib/stats.js?v=v39"></script>
  <script src="js/lib/dates.js?v=v39"></script>
  <script src="js/lib/kalman.js?v=v39"></script>
  <script src="js/lib/bodycomp.js?v=v39"></script>
  <script src="js/core/metrics.js?v=v39"></script>
  <script src="js/core/store.js?v=v39"></script>
  <script src="js/core/sheets.js?v=v39"></script>

  <!-- שכבת התצוגה -->
  <script src="js/ui/format.js?v=v39"></script>
  <script src="js/ui/chart.js?v=v39"></script>
  <script src="js/ui/components.js?v=v39"></script>
  <script src="js/ui/controls.js?v=v39"></script>
  <script src="js/views/home.js?v=v39"></script>
  <script src="js/views/entry.js?v=v39"></script>
  <script src="js/views/calc.js?v=v39"></script>
  <script src="js/views/progress.js?v=v39"></script>
  <script src="js/views/target.js?v=v39"></script>
  <script src="js/views/status.js?v=v39"></script>
  <script src="js/views/trends.js?v=v39"></script>
  <script src="js/views/data.js?v=v39"></script>
  <script src="js/app.js?v=v39"></script>
</body>
</html>
